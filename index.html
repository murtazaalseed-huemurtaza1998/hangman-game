<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Hangman Game - HTML CSS JavaScript">
  <title>Hangman Game | Interactive Word Game</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Hangman</h1>
      <p>Guess the word before the man is hanged!</p>
    </div>

    <div class="game-info">
      <div class="category">Category: <span id="category"></span></div>
      <div class="score">Wins: <span id="wins">0</span></div>
    </div>

    <div class="game-area">
      <div class="hangman-draw">
        <svg width="200" height="250">
          <!-- Gallows -->
          <line x1="20" y1="230" x2="180" y2="230" class="part" />
          <line x1="50" y1="230" x2="50" y2="20" class="part" />
          <line x1="50" y1="20" x2="130" y2="20" class="part" />
          <line x1="130" y1="20" x2="130" y2="40" class="part" />
          <!-- Man -->
          <circle cx="130" cy="60" r="20" class="part" />
          <line x1="130" y1="80" x2="130" y2="140" class="part" />
          <line x1="130" y1="100" x2="110" y2="120" class="part" />
          <line x1="130" y1="100" x2="150" y2="120" class="part" />
          <line x1="130" y1="140" x2="110" y2="170" class="part" />
          <line x1="130" y1="140" x2="150" y2="170" class="part" />
        </svg>
      </div>

      <div class="word-display" id="word-display"></div>
    </div>

    <div class="letters" id="letters"></div>

    <div class="message" id="message"></div>

    <button class="new-game-btn" id="new-game">New Game</button>

    <footer>
      <p>© 2026 Hangman Game Template | Ready for Sale</p>
    </footer>
    
    <audio id="success" src="success.mp3" preload="auto"></audio>
<audio id="fail" src="fail.mp3" preload="auto"></audio>
  </div>
  <script src="main.js"></script>
</body>
</html>
